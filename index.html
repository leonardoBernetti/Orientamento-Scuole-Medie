<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Day Informatica – IIS Rosselli-Rasetti</title>
<meta name="theme-color" content="#0b0e18">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/touch-icon.png">
<!-- Tema salvato: applicato subito per evitare il lampo di colore al caricamento -->
<script>try{var t=localStorage.getItem("rr_theme");document.documentElement.dataset.theme=t==="light"||t==="xmas"?t:"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body data-s="start">
<canvas id="bg" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>

<div id="app">
 <header>
  <img class="lg hd" id="hl" alt="IIS Rosselli – torna all’inizio" src="assets/logo.png">
  <div class="sp"></div>
  <button class="snd hd" id="hh" title="Home" aria-label="Torna alla home">🏠</button>
  <button class="snd hd" id="hm" title="Menu giochi" aria-label="Menu giochi">🎮</button>
  <div class="chip hd">⭐ <span id="sc">0</span> pt</div>
  <div class="chip hd"><div class="bar"><i id="pb"></i></div><span id="pt">0/9</span></div>
  <button class="tsw" id="tb" role="switch" aria-checked="true" aria-label="Tema scuro" title="Cambia tema"><span class="kn"></span></button>
  <button class="snd" id="sb" title="Suoni on/off" aria-label="Attiva o disattiva i suoni">🔊</button>
 </header>
 <main id="main"></main>
</div>

<!-- Messaggio in pagina (sostituisce le finestre alert del browser) -->
<div id="dlg" class="dlg hidden" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">
 <div class="dlg-box">
  <div class="dlg-ic" id="dlgI"></div>
  <p id="dlgT"></p>
  <button class="btn" id="dlgOk">OK</button>
 </div>
</div>

<script src="contenuti.js"></script>
<script src="app.js"></script>
</body>
</html>
