<title>Open Day Informatica – IIS Rosselli-Rasetti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@600;800&display=swap">
<style>
.game{font:400 16px/1.5 Outfit,system-ui,sans-serif;color:#f1f5f9;background:#0b1220;border-radius:24px;padding:12px;text-transform:none}
:where(.game) *,:where(.game) ::before,:where(.game) ::after{border:0 solid #334155}
.game h2,.game h3,.game p{margin:0;font-family:inherit}.game canvas{display:block}.game select{font:inherit}
.game button{font-family:inherit}.game .font-mono-tech{font-family:'Share Tech Mono',monospace}
.game .glass-panel{background:rgba(15,23,42,.94);border:1px solid rgba(56,189,248,.2)}
.game .glass-card{background:rgba(30,41,59,.65);border:1px solid rgba(255,255,255,.08)}
.game .block-executing{border-color:#38bdf8!important;background:rgba(6,182,212,.4)!important}

:root{--bg:#0b0e18;--fade:rgba(11,14,24,.14);--card:#161b2e;--card2:#1e2540;--tx:#f2f5ff;--mut:#9aa6c9;--or:#f15a22;--cy:#27d3ff;--gr:#2ee59d;--rd:#ff5470;--yl:#ffd23f;--bd:#2c3558;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#eef2fb;--fade:rgba(238,242,251,.14);--card:#fff;--card2:#e6ebf8;--tx:#1b2140;--mut:#56608a;--bd:#c9d2ec;--cy:#0a8fb8;--gr:#0d9c66;--rd:#d62f4d;--yl:#b88600;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:800 17px/1.45 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;opacity:.5}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3,.ft{font-family:Orbitron,Nunito,system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lg{height:44px;background:#fff;border-radius:12px;padding:4px 10px;cursor:pointer}
.sp{flex:1}
.chip{background:var(--card);border:2px solid var(--bd);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-weight:900}
.bar{width:110px;height:10px;background:var(--card2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--yl));transition:width .6s}
body[data-s=start] .hd{display:none}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--or);color:#fff;border:0;border-radius:16px;padding:14px 26px;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 #a73a12;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 #a73a12}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a73a12}
.btn.g{background:var(--card2);box-shadow:0 5px 0 var(--bd);color:var(--tx)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.snd{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--card);font-size:1.2rem}
.scr{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:20px 0}
.hero .big{background:#fff;border-radius:22px;padding:12px 20px;width:min(560px,92%);box-shadow:0 0 40px rgba(241,90,34,.35);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font-size:clamp(1.5rem,5vw,2.8rem);margin:26px 0 10px;line-height:1.15;background:linear-gradient(90deg,var(--or),var(--yl),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:1.15rem;max-width:620px;margin:0 auto 18px}
.term{font:700 .95rem ui-monospace,Consolas,monospace;color:var(--gr);background:#05070d;border:2px solid var(--bd);border-radius:14px;max-width:420px;margin:0 auto 22px;padding:12px 16px;text-align:left;min-height:84px}
.term b{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.big-btn{font-size:1.3rem;padding:18px 40px;animation:pu 1.6s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
h2{font-size:1.5rem;margin:6px 0 14px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-6px) rotate(-.4deg);border-color:var(--c,var(--cy));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card .ic{font-size:2.6rem;line-height:1}
.card h3{font-size:1.05rem;color:var(--c,var(--cy))}
.card p{margin:0;color:var(--mut);flex:1}
.card .btn{align-self:flex-start;padding:10px 20px;box-shadow:0 4px 0 #a73a12}
.tag{font-size:.85rem;color:var(--gr)}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:22px}
.dots{display:flex;gap:6px;margin-bottom:14px}.dots i{flex:1;height:8px;border-radius:6px;background:var(--card2)}.dots i.on{background:var(--cy)}.dots i.ok{background:var(--gr)}.dots i.ko{background:var(--rd)}
.q{font-size:1.25rem;margin:0 0 14px}
.big-e{font-size:4rem;text-align:center;animation:fl 3s infinite}
pre{background:#05070d;color:#7dffb5;border-radius:14px;padding:14px;overflow-x:auto;font:700 1rem ui-monospace,Consolas,monospace;margin:0 0 14px;max-width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{background:var(--card2);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--cy);transform:scale(1.03)}
.opt.ok{background:var(--gr);border-color:var(--gr);color:#04140c}.opt.ko{background:var(--rd);border-color:var(--rd);color:#fff;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.inp{width:100%;font:900 1.3rem Orbitron,monospace;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card2);color:var(--tx);text-align:center;margin-bottom:12px;text-transform:uppercase}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--card2);animation:in .3s both}
.fb.ok{border-left:6px solid var(--gr)}.fb.ko{border-left:6px solid var(--rd)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.center{text-align:center}
.score{font:900 3rem Orbitron;color:var(--yl)}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.b{background:var(--card2);border:2px solid var(--bd);border-radius:18px;padding:12px;text-align:center;font-size:.9rem}
.b span{font-size:2.2rem;display:block}.b.lock{opacity:.35;filter:grayscale(1)}.b.get{border-color:var(--yl);animation:pu 1s 2}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn{padding:10px 18px;box-shadow:0 4px 0 var(--bd)}.tabs .btn.a{background:var(--cy);color:#041018;box-shadow:0 4px 0 #0a7a99}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.info div{background:var(--card2);border-radius:16px;padding:14px}.info div b{display:block;color:var(--cy)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:var(--yl);color:#1b1500;padding:12px 22px;border-radius:16px;font-weight:900;z-index:9;transition:transform .5s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.s{transform:translate(-50%,0)}
.cf{position:fixed;top:-40px;z-index:8;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tm2{display:flex;gap:12px;margin-bottom:14px}.team{flex:1;background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:10px;text-align:center;transition:all .3s}.team.on{border-color:var(--yl);box-shadow:0 0 22px rgba(255,210,63,.35);transform:scale(1.03)}
.team input{background:transparent;border:0;color:var(--tx);font:900 .95rem Orbitron,sans-serif;text-align:center;width:100%;outline:0}.team b{font:900 1.8rem Orbitron,sans-serif;color:var(--yl)}
.rg{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-items:start}@media(max-width:780px){.rg{grid-template-columns:1fr}}
#wc{width:100%;height:auto;max-width:380px;display:block;margin:0 auto 12px}
.wd{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin:10px 0 12px}.wd>div{display:flex;gap:4px}
.lb{width:clamp(22px,5vw,36px);height:clamp(30px,7vw,46px);border-radius:8px;background:var(--yl);color:#1b1500;font:900 clamp(.9rem,2.6vw,1.2rem) Orbitron,sans-serif;display:flex;align-items:center;justify-content:center}.lb.h{background:var(--card2);border:2px solid var(--bd);color:transparent}.lb.n{animation:pu .6s}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:6px;margin:12px 0}.k{padding:9px 0;border-radius:10px;border:2px solid var(--bd);background:var(--card2);font-weight:900}.k.v{border-color:var(--cy)}.k:hover:not(:disabled){background:var(--or);color:#fff}.k:disabled{opacity:.25;cursor:not-allowed}
.msg{min-height:3.2em;font-weight:900}.rc .btn{padding:10px 16px;font-size:.95rem}
a.btn{display:inline-block;text-decoration:none;text-align:center}.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}.lk a.btn{padding:12px 16px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.mh h2{margin:0}.il{width:64px;height:64px;border-radius:50%;box-shadow:0 0 22px rgba(39,211,255,.5);flex:none}.nv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:8px 0;border-bottom:2px solid var(--bd)}.np{font:900 .9rem Orbitron,sans-serif;color:var(--mut);margin:0 auto}button{touch-action:manipulation}@media(max-width:520px){.nv .btn{padding:8px 10px;font-size:.8rem}}.nv .btn{padding:8px 14px;font-size:.9rem;box-shadow:0 3px 0 var(--bd)}
:root[data-theme=tech]{--bg:#050814;--fade:rgba(5,8,20,.14);--card:#0f172a;--card2:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--or:#06b6d4;--cy:#38bdf8;--gr:#10b981;--rd:#fb7185;--yl:#fbbf24;--bd:rgba(56,189,248,.28);color-scheme:dark}

.tsw{position:relative;flex:none;width:84px;height:42px;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:linear-gradient(90deg,#ffd23f,#ff9f1c);cursor:pointer;padding:0;overflow:hidden;box-shadow:0 0 14px rgba(255,159,28,.45);transition:background .45s,box-shadow .45s,border-color .45s}

.tsw .kn{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.68,-.45,.27,1.45),background .4s,box-shadow .4s}
